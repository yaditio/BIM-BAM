<div id="qtoModal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-table"></i> Quantity Take-Off (QTO)</h3>
                <button class="btn-close" id="btnCloseQto"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-controls">
                <div class="search-box" style="flex: 1; margin-right: 12px;">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="qtoSearch" placeholder="Search quantities, types or classes...">
                </div>
                <button class="btn btn-primary" id="btnExportCsv">
                    <i class="fa-solid fa-file-csv"></i> Export CSV
                </button>
            </div>
            <div class="qto-split-container">
                <div class="table-container">
                    <table class="qto-table" id="qtoTable">
                        <thead>
                            <tr>
                                <th>IFC Class</th>
                                <th>Category</th>
                                <th>Family Object Name</th>
                                <th>Quantity Name</th>
                                <th>Value</th>
                                <th>Unit</th>
                                <th>Unit Price</th>
                                <th>Total Price</th>
                            </tr>
                        </thead>
                        <tbody id="qtoTableBody">
                            <!-- Dynamically generated rows -->
                        </tbody>
                    </table>
                </div>
                <div class="qto-charts-container">
                    <div class="qto-chart-wrapper">
                        <h4>Budget Distribution by Category</h4>
                        <div class="qto-chart-canvas-holder">
                            <canvas id="qtoPieChart"></canvas>
                        </div>
                    </div>
                    <div class="qto-chart-wrapper">
                        <h4>Accumulated Price by Category</h4>
                        <div class="qto-chart-canvas-holder">
                            <canvas id="qtoBarChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <span id="qtoSummaryText">Total quantity entries: 0</span>
            </div>
        </div>
    </div>
